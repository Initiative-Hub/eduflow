name: eduflow

services:
  postgres:
    image: postgres:latest
    container_name: eduflow_postgres
    restart: unless-stopped
    environment: 
      - POSTGRES_DB=eduflow_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports: 
      - "5433:5432"
    networks: 
      - db-network
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduflow_db"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes: 
      - postgres_data:/var/lib/postgresql
    command: postgres -c listen_addresses='*'
    logging: 
      options: 
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:latest
    container_name: eduflow_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:latest
    container_name: eduflow_minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    networks:
      - storage-network

  minio-init:
    image: minio/mc:latest
    container_name: eduflow_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb --ignore-existing local/eduflow-avatars;
      mc anonymous set none local/eduflow-avatars;
      mc mb --ignore-existing local/eduflow-inventory;
      mc anonymous set none local/eduflow-inventory;
      "
    networks:
      - storage-network

  minio-reset:
    image: minio/mc:latest
    profiles: ["optional"]
    container_name: eduflow_minio_reset
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc rm --force --recursive local/eduflow-avatars;
      mc mb --ignore-existing local/eduflow-avatars;
      mc anonymous set none local/eduflow-avatars;
      mc rm --force --recursive local/eduflow-inventory;
      mc mb --ignore-existing local/eduflow-inventory;
      mc anonymous set none local/eduflow-inventory;
      "
    networks:
      - storage-network

  redis: 
    image: redis:latest
    container_name: eduflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - cache-network

  srh:
    image: hiett/serverless-redis-http:latest
    container_name: eduflow_srh
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: example_token
      SRH_CONNECTION_STRING: redis://redis:6379
    networks:
      - cache-network

  markitdown:
    build:
      context: ./external-services
      dockerfile: Dockerfile
    container_name: eduflow_markitdown
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./external-services/.env

networks: 
  db-network:
  storage-network:
  cache-network:

volumes:
  postgres_data:
  minio_data:
