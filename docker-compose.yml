name: eduflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: eduflow_postgres
    restart: always
    environment: 
      - POSTGRES_DB=eduflow_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports: 
      - "5433:5432"
    networks: 
      - prisma-network
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U prisma -d postgres"] 
      interval: 5s
      timeout: 2s
      retries: 20
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    logging: 
      options: 
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit
    container_name: eduflow_mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:latest
    container_name: eduflow_minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: eduflow_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb --ignore-existing local/eduflow-avatars;
      mc anonymous set none local/eduflow-avatars;
      "
  minio-reset:
    image: minio/mc:latest
    container_name: eduflow_minio_reset
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc rm --force --recursive local/eduflow-avatars;
      mc mb --ignore-existing local/eduflow-avatars;
      mc anonymous set none local/eduflow-avatars;
      "

networks: 
  prisma-network: 
volumes: 
  postgres_data: 
  minio_data:
