    <!-- Card 2 -->
    <rect x="580" y="0" width="530" height="180" fill="#EDE2C4" rx="16" stroke="#8C3B2E" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 610,90 L 625,105 L 655,70" stroke="#8C3B2E" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#5C4A36">{{summary_points.2|35}}</text>

