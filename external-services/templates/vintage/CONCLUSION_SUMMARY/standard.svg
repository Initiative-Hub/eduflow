    <path d="M 610,310 L 625,325 L 655,290" stroke="#4E6E58" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#5C4A36">{{summary_points.4|35}}</text>
