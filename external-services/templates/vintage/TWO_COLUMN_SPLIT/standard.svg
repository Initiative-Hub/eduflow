<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E6E58" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Heading -->
  <text x="140" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="bold" fill="#3E2C1C">{{heading|24}}</text>
  <rect x="140" y="155" width="220" height="4" fill="#4E6E58" rx="2"/>

  <!-- Left Column -->
  <g transform="translate(140, 220)">
    <rect width="520" height="500" fill="#EDE2C4" fill-opacity="0.6" rx="16" stroke="#4E6E58" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="40" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#4E6E58">{{left_col_title|30}}</text>
    <line x1="40" y1="90" x2="480" y2="90" stroke="#4E6E58" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Text lines -->
    <text x="40" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{left_col_text.1|40}}</text>
    <text x="40" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{left_col_text.2|40}}</text>
    <text x="40" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{left_col_text.3|40}}</text>
    <text x="40" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{left_col_text.4|40}}</text>
    <text x="40" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{left_col_text.5|40}}</text>
  </g>

  <!-- Right Column -->
  <g transform="translate(740, 220)">
    <rect width="520" height="500" fill="#EDE2C4" fill-opacity="0.6" rx="16" stroke="#8C3B2E" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="40" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#8C3B2E">{{right_col_title|30}}</text>
    <line x1="40" y1="90" x2="480" y2="90" stroke="#8C3B2E" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Text lines -->
    <text x="40" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{right_col_text.1|40}}</text>
    <text x="40" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{right_col_text.2|40}}</text>
    <text x="40" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{right_col_text.3|40}}</text>
    <text x="40" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{right_col_text.4|40}}</text>
    <text x="40" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{right_col_text.5|40}}</text>
  </g>
</svg>
