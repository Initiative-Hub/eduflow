<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E6E58" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Heading -->
  <text x="140" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#3E2C1C">{{heading|24}}</text>
  <rect x="140" y="155" width="220" height="4" fill="#4E6E58" rx="2"/>

  <!-- Featured image, left -->
  <g transform="translate(140, 210)">
    <rect x="-6" y="-6" width="652" height="472" fill="none" stroke="#4E6E58" stroke-width="2" stroke-opacity="0.4" rx="20"/>
    <clipPath id="feat_clip"><rect width="640" height="460" rx="16"/></clipPath>
    <image width="640" height="460" href="{{image_1}}" clip-path="url(#feat_clip)" preserveAspectRatio="xMidYMid slice"/>
    <text x="0" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#4E6E58">{{label_1|26}}</text>
    <text x="0" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36">{{caption_1|34}}</text>
  </g>

  <!-- Stacked images, right -->
  <g transform="translate(850, 210)">
    <clipPath id="stack_clip_a"><rect width="450" height="215" rx="14"/></clipPath>
    <image width="450" height="215" href="{{image_2}}" clip-path="url(#stack_clip_a)" preserveAspectRatio="xMidYMid slice"/>
    <text x="0" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#8C3B2E">{{label_2|26}}</text>
    <text x="0" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5C4A36">{{caption_2|34}}</text>
  </g>
  <g transform="translate(850, 520)">
    <clipPath id="stack_clip_b"><rect width="450" height="215" rx="14"/></clipPath>
    <image width="450" height="215" href="{{image_3}}" clip-path="url(#stack_clip_b)" preserveAspectRatio="xMidYMid slice"/>
    <text x="0" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#8C3B2E">{{label_3|26}}</text>
    <text x="0" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5C4A36">{{caption_3|34}}</text>
  </g>
</svg>
