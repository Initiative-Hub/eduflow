<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <!-- Background -->
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E6E58" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="1200" cy="150" r="160" fill="#8C3B2E" fill-opacity="0.18"/>

  <!-- Heading -->
  <text x="140" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#3E2C1C">{{heading|24}}</text>
  <rect x="140" y="175" width="220" height="4" fill="#4E6E58" rx="2"/>

  <!-- Body Text (Wrapped lines) -->
  <text x="140" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{body_text.1|50}}</text>
  <text x="140" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{body_text.2|50}}</text>
  <text x="140" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{body_text.3|50}}</text>
  <text x="140" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{body_text.4|50}}</text>
  <text x="140" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{body_text.5|50}}</text>
  <text x="140" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{body_text.6|50}}</text>

  <!-- Image Frame -->
  <g>
    <rect x="795" y="215" width="510" height="430" rx="16" fill="none" stroke="#4E6E58" stroke-width="2" stroke-opacity="0.6"/>
    <image x="800" y="220" width="500" height="420" href="{{media_image}}" rx="12" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
