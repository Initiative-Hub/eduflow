<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E6E58" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Quotation mark backdrop -->
  <text x="140" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="bold" fill="#4E6E58" fill-opacity="0.1">“</text>

  <!-- Quote block content -->
  <g transform="translate(180, 260)">
    <text x="40" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#3E2C1C">{{quote.1|60}}</text>
    <text x="40" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#3E2C1C">{{quote.2|60}}</text>
    <text x="40" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#3E2C1C">{{quote.3|60}}</text>
    
    <!-- Author / Source label -->
    <rect x="40" y="270" width="80" height="4" fill="#8C3B2E" rx="2"/>
    <text x="140" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#8C3B2E">— {{author_or_source|50}}</text>
  </g>

  <!-- Title / context at bottom left -->
  <text x="140" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#94A3B8">{{heading|24}}</text>
</svg>
