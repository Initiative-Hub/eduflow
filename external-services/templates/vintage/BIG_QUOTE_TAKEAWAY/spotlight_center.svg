<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <circle cx="720" cy="405" r="340" fill="#8C3B2E" fill-opacity="0.18"/>
  <circle cx="180" cy="120" r="120" fill="#4E6E58" fill-opacity="0.18"/>
  <circle cx="1280" cy="700" r="150" fill="#4E6E58" fill-opacity="0.18"/>

  <!-- Small kicker -->
  <text x="720" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="6" fill="#4E6E58" text-anchor="middle">{{heading|24}}</text>

  <!-- Giant quotation mark -->
  <text x="720" y="300" font-family="Georgia, serif" font-size="200" fill="#8C3B2E" fill-opacity="0.85" text-anchor="middle">&#8220;</text>

  <!-- Quote, centered -->
  <text x="720" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#3E2C1C" text-anchor="middle">{{quote.1|60}}</text>
  <text x="720" y="455" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#3E2C1C" text-anchor="middle">{{quote.2|60}}</text>
  <text x="720" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#3E2C1C" text-anchor="middle">{{quote.3|60}}</text>

  <line x1="570" y1="580" x2="870" y2="580" stroke="#4E6E58" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Attribution -->
  <text x="720" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#4E6E58" text-anchor="middle">{{author_or_source|50}}</text>
</svg>
