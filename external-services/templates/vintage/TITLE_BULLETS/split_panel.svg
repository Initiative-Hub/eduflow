<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <!-- Left heading panel -->
  <rect x="0" y="0" width="470" height="810" fill="#EDE2C4"/>
  <rect x="462" y="0" width="8" height="810" fill="#4E6E58"/>
  <circle cx="110" cy="700" r="120" fill="#8C3B2E" fill-opacity="0.18"/>

  <rect x="80" y="270" width="90" height="8" fill="#8C3B2E" rx="4"/>
  <!-- Heading wraps to up to 3 lines; data-w lets long lines shrink to fit the panel -->
  <text x="80" y="350" data-w="360" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#3E2C1C">{{heading.1|16}}</text>
  <text x="80" y="410" data-w="360" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#3E2C1C">{{heading.2|16}}</text>
  <text x="80" y="470" data-w="360" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#3E2C1C">{{heading.3|16}}</text>

  <!-- Bullets, right -->
  <g transform="translate(560, 140)">
    <!-- Bullet 1 -->
    <g>
      <rect x="0" y="18" width="18" height="18" fill="#8C3B2E" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{bullets.1|70}}</text>
    </g>
    <!-- Bullet 2 -->
    <g transform="translate(0, 110)">
      <rect x="0" y="18" width="18" height="18" fill="#4E6E58" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{bullets.2|70}}</text>
    </g>
    <!-- Bullet 3 -->
    <g transform="translate(0, 220)">
      <rect x="0" y="18" width="18" height="18" fill="#8C3B2E" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{bullets.3|70}}</text>
    </g>
    <!-- Bullet 4 -->
    <g transform="translate(0, 330)">
      <rect x="0" y="18" width="18" height="18" fill="#4E6E58" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{bullets.4|70}}</text>
    </g>
    <!-- Bullet 5 -->
    <g transform="translate(0, 440)">
      <rect x="0" y="18" width="18" height="18" fill="#8C3B2E" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#5C4A36">{{bullets.5|70}}</text>
    </g>
  </g>
</svg>
