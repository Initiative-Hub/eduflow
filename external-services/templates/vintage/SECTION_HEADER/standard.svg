<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E6E58" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Geometric backdrop visual -->
  <rect x="300" y="250" width="840" height="300" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.2" rx="20"/>
  <rect x="320" y="270" width="800" height="260" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.2" rx="16"/>

  <!-- Centered content -->
  <g transform="translate(720, 400)">
    <!-- Sub-module kicker -->
    <text x="0" y="-60" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="4" font-weight="600" fill="#8C3B2E" text-anchor="middle">{{sub_module_name|40}}</text>
    
    <!-- Giant Heading -->
    <text x="0" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="extrabold" fill="#3E2C1C" text-anchor="middle">{{heading|24}}</text>
    
    <rect x="-150" y="80" width="300" height="4" fill="#4E6E58" rx="2"/>
  </g>
</svg>
