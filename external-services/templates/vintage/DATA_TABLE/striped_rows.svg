<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <circle cx="1320" cy="100" r="140" fill="#4E6E58" fill-opacity="0.18"/>

  <!-- Heading -->
  <text x="140" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#3E2C1C">{{heading|24}}</text>
  <rect x="140" y="165" width="220" height="4" fill="#4E6E58" rx="2"/>

  <!-- Zebra-striped table -->
  <g transform="translate(140, 230)">
    <!-- Header band -->
    <rect width="1160" height="90" fill="#4E6E58" fill-opacity="0.18" rx="14"/>
    <text x="40" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#4E6E58">{{header_1|20}}</text>
    <text x="330" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#4E6E58">{{header_2|20}}</text>
    <text x="620" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#4E6E58">{{header_3|20}}</text>
    <text x="910" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#4E6E58">{{header_4|20}}</text>

    <!-- Row 1 (striped) -->
    <g transform="translate(0, 110)">
      <rect width="1160" height="100" fill="#EDE2C4" rx="12"/>
      <text x="40" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_1_1|20}}</text>
      <text x="330" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_1_2|20}}</text>
      <text x="620" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_1_3|20}}</text>
      <text x="910" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_1_4|20}}</text>
    </g>
    <!-- Row 2 (plain) -->
    <g transform="translate(0, 230)">
      <text x="40" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_2_1|20}}</text>
      <text x="330" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_2_2|20}}</text>
      <text x="620" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_2_3|20}}</text>
      <text x="910" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_2_4|20}}</text>
    </g>
    <!-- Row 3 (striped) -->
    <g transform="translate(0, 350)">
      <rect width="1160" height="100" fill="#EDE2C4" rx="12"/>
      <text x="40" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_3_1|20}}</text>
      <text x="330" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_3_2|20}}</text>
      <text x="620" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_3_3|20}}</text>
      <text x="910" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#5C4A36">{{row_3_4|20}}</text>
    </g>
    <!-- Pink baseline -->
    <rect x="0" y="470" width="1160" height="4" fill="#8C3B2E" rx="2" fill-opacity="0.6"/>
  </g>
</svg>
