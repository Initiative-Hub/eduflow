    <text x="180" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#4E6E58" text-anchor="middle">{{stat_3|12}}</text>
    <text x="180" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5C4A36" text-anchor="middle">{{label_3|30}}</text>
