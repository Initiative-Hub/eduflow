<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#F5EEDC"/><rect x="18" y="18" width="1404" height="774" fill="none" stroke="#8C3B2E" stroke-width="2" stroke-opacity="0.55"/><rect x="28" y="28" width="1384" height="754" fill="none" stroke="#4E6E58" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E6E58" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Heading -->
  <text x="140" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#3E2C1C">{{heading|24}}</text>
  <rect x="140" y="175" width="220" height="4" fill="#4E6E58" rx="2"/>

  <!-- Stat Columns -->
  <!-- Col 1 -->
  <g transform="translate(140, 280)">
    <rect width="340" height="360" fill="#EDE2C4" rx="16" stroke="#4E6E58" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="170" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="black" fill="#4E6E58" text-anchor="middle">{{stat_1|12}}</text>
    <text x="170" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#5C4A36" text-anchor="middle">{{label_1|30}}</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(520, 280)">
    <rect width="340" height="360" fill="#EDE2C4" rx="16" stroke="#8C3B2E" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="170" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="black" fill="#8C3B2E" text-anchor="middle">{{stat_2|12}}</text>
    <text x="170" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#5C4A36" text-anchor="middle">{{label_2|30}}</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(900, 280)">
    <rect width="340" height="360" fill="#EDE2C4" rx="16" stroke="#4E6E58" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="170" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="black" fill="#4E6E58" text-anchor="middle">{{stat_3|12}}</text>
    <text x="170" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#5C4A36" text-anchor="middle">{{label_3|30}}</text>
  </g>
</svg>
