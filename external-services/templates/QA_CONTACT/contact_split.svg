<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#0A0E1A"/>
  <rect x="0" y="0" width="620" height="810" fill="#111827"/>
  <line x1="620" y1="0" x2="620" y2="810" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="120" cy="120" r="100" fill="#FF007F" fill-opacity="0.07"/>

  <!-- Left: giant typographic Q&A -->
  <text x="310" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="220" font-weight="900" fill="#00F0FF" text-anchor="middle">Q&amp;A</text>
  <rect x="200" y="450" width="220" height="6" fill="#FF007F" rx="3"/>
  <text x="310" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="30" fill="#E2E8F0" text-anchor="middle">Ask us anything</text>

  <!-- Right: thanks + contact -->
  <g transform="translate(720, 280)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="bold" fill="#FFFFFF">Thank you!</text>
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#E2E8F0">We appreciate your time and attention.</text>

    <rect x="0" y="120" width="600" height="80" fill="#0A0E1A" rx="14" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="30" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#00F0FF">{{footer_note.1|50}}</text>

    <rect x="0" y="230" width="600" height="80" fill="#0A0E1A" rx="14" stroke="#FF007F" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="30" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#FF007F">{{footer_note.2|50}}</text>
  </g>
</svg>
