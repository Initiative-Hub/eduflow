      <path d="M 56 95 L 66 106 L 85 82" fill="none" stroke="#FF007F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#E2E8F0">{{summary_points.2|35}}</text>
    </g>
    <!-- Point 3 -->
    <g transform="translate(0, 230)">
      <rect width="570" height="190" fill="#111827" rx="18" stroke="#FF007F" stroke-width="1.5" stroke-opacity="0.3"/>
      <circle cx="70" cy="95" r="30" fill="#FF007F" fill-opacity="0.15" stroke="#FF007F" stroke-width="2"/>
      <path d="M 56 95 L 66 106 L 85 82" fill="none" stroke="#FF007F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#E2E8F0">{{summary_points.3|35}}</text>
    </g>
    <!-- Point 4 -->
    <g transform="translate(610, 230)">
      <rect width="570" height="190" fill="#111827" rx="18" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3"/>
      <circle cx="70" cy="95" r="30" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="2"/>
