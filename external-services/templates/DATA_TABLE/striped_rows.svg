<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#0A0E1A"/>
  <circle cx="1320" cy="100" r="140" fill="#00F0FF" fill-opacity="0.05"/>

  <!-- Heading -->
  <text x="140" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">{{heading|24}}</text>
  <rect x="140" y="165" width="220" height="4" fill="#00F0FF" rx="2"/>

  <!-- Zebra-striped table -->
  <g transform="translate(140, 230)">
    <!-- Header band -->
    <rect width="1160" height="90" fill="#00F0FF" fill-opacity="0.12" rx="14"/>
    <text x="40" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#00F0FF">{{header_1|20}}</text>
    <text x="330" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#00F0FF">{{header_2|20}}</text>
    <text x="620" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#00F0FF">{{header_3|20}}</text>
    <text x="910" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#00F0FF">{{header_4|20}}</text>

    <!-- Row 1 (striped) -->
    <g transform="translate(0, 110)">
      <rect width="1160" height="100" fill="#111827" rx="12"/>
      <text x="40" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_1_1|20}}</text>
      <text x="330" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_1_2|20}}</text>
      <text x="620" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_1_3|20}}</text>
      <text x="910" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_1_4|20}}</text>
    </g>
    <!-- Row 2 (plain) -->
    <g transform="translate(0, 230)">
      <text x="40" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_2_1|20}}</text>
      <text x="330" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_2_2|20}}</text>
      <text x="620" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_2_3|20}}</text>
      <text x="910" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_2_4|20}}</text>
    </g>
    <!-- Row 3 (striped) -->
    <g transform="translate(0, 350)">
      <rect width="1160" height="100" fill="#111827" rx="12"/>
      <text x="40" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_3_1|20}}</text>
      <text x="330" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_3_2|20}}</text>
      <text x="620" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_3_3|20}}</text>
      <text x="910" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="25" fill="#E2E8F0">{{row_3_4|20}}</text>
    </g>
    <!-- Pink baseline -->
    <rect x="0" y="470" width="1160" height="4" fill="#FF007F" rx="2" fill-opacity="0.6"/>
  </g>
</svg>
