<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FFFFFF"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#0F62FE" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Heading -->
  <text x="140" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="bold" fill="#111111">{{heading|24}}</text>
  <rect x="140" y="175" width="220" height="4" fill="#0F62FE" rx="2"/>

  <!-- Call to Action layout -->
  <g transform="translate(140, 240)">
    <rect width="1160" height="440" fill="#F4F6F8" rx="24" stroke="#0F62FE" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Large decorative background pill -->
    <rect x="920" y="40" width="200" height="360" fill="#111111" fill-opacity="0.1" rx="16"/>
    <text x="1020" y="230" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="black" fill="#111111" text-anchor="middle" letter-spacing="4">ACT NOW</text>

    <!-- List -->
    <!-- Item 1 -->
    <circle cx="60" cy="80" r="10" fill="#0F62FE"/>
    <text x="100" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#111111">{{action_items.1|50}}</text>

    <!-- Item 2 -->
    <circle cx="60" cy="180" r="10" fill="#0F62FE"/>
    <text x="100" y="190" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#111111">{{action_items.2|50}}</text>

    <!-- Item 3 -->
    <circle cx="60" cy="280" r="10" fill="#0F62FE"/>
    <text x="100" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#111111">{{action_items.3|50}}</text>

    <!-- Item 4 -->
    <circle cx="60" cy="380" r="10" fill="#0F62FE"/>
    <text x="100" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#111111">{{action_items.4|50}}</text>
  </g>
</svg>
