<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FFFFFF"/>
  <!-- Pink slab, left third -->
  <rect x="0" y="0" width="420" height="810" fill="#111111" fill-opacity="0.18"/>
  <rect x="412" y="0" width="8" height="810" fill="#111111"/>
  <circle cx="210" cy="180" r="110" fill="#0F62FE" fill-opacity="0.18"/>
  <circle cx="1280" cy="680" r="170" fill="#0F62FE" fill-opacity="0.18"/>

  <!-- Module kicker chip -->
  <g transform="translate(500, 300)">
    <rect width="440" height="52" fill="#F4F6F8" rx="26" stroke="#0F62FE" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="30" cy="26" r="8" fill="#0F62FE"/>
    <text x="56" y="35" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#0F62FE">{{sub_module_name|40}}</text>
  </g>

  <!-- Big section title -->
  <text x="500" y="470" data-w="840" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="900" fill="#111111">{{heading|24}}</text>
  <rect x="504" y="510" width="320" height="6" fill="#0F62FE" rx="3"/>
</svg>
