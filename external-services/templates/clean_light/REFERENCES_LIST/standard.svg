    <text x="40" y="350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#111111">{{source_title_3|70}}</text>
    <text x="40" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#0F62FE">{{source_url_3|80}}</text>
