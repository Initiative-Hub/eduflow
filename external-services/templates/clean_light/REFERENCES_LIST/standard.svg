    <text x="40" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#111111">{{source_title_1|70}}</text>
    <text x="40" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#0F62FE">{{source_url_1|80}}</text>

    <!-- Source 2 -->
    <rect x="0" y="150" width="1160" height="120" fill="#F4F6F8" rx="12" stroke="#111111" stroke-width="1" stroke-opacity="0.3"/>
    <text x="40" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#111111">{{source_title_2|70}}</text>
    <text x="40" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#111111">{{source_url_2|80}}</text>

    <!-- Source 3 -->
