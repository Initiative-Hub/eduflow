<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FFFFFF"/>
  <rect x="0" y="0" width="620" height="810" fill="#F4F6F8"/>
  <line x1="620" y1="0" x2="620" y2="810" stroke="#0F62FE" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="120" cy="120" r="100" fill="#111111" fill-opacity="0.18"/>

  <!-- Left: giant typographic Q&A -->
  <text x="310" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="220" font-weight="900" fill="#0F62FE" text-anchor="middle">Q&amp;A</text>
  <rect x="200" y="450" width="220" height="6" fill="#111111" rx="3"/>
  <text x="310" y="530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#4B5563" text-anchor="middle">Ask us anything</text>

  <!-- Right: thanks + contact -->
  <g transform="translate(720, 280)">
    <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" fill="#111111">Thank you!</text>
    <text x="0" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#4B5563">We appreciate your time and attention.</text>

    <rect x="0" y="120" width="600" height="80" fill="#FFFFFF" rx="14" stroke="#0F62FE" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="30" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#0F62FE">{{footer_note.1|50}}</text>

    <rect x="0" y="230" width="600" height="80" fill="#FFFFFF" rx="14" stroke="#111111" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="30" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#111111">{{footer_note.2|50}}</text>
  </g>
</svg>
