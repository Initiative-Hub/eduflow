<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FFFFFF"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#0F62FE" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Centered concluding content -->
  <g transform="translate(720, 400)">
    <rect x="-450" y="-220" width="900" height="400" fill="#F4F6F8" fill-opacity="0.7" rx="24" stroke="#111111" stroke-width="2" stroke-opacity="0.4"/>
    
    <text x="0" y="-120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="extrabold" fill="#0F62FE" text-anchor="middle">Questions &amp; Answers</text>
    <text x="0" y="-30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#111111" text-anchor="middle">Thank you for your time!</text>
    
    <line x1="-150" y1="30" x2="150" y2="30" stroke="#111111" stroke-width="2"/>
    
    <text x="0" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#4B5563" text-anchor="middle">{{footer_note.1|50}}</text>
    <text x="0" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#4B5563" text-anchor="middle">{{footer_note.2|50}}</text>
  </g>
</svg>
