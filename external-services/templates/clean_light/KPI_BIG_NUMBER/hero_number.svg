<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FFFFFF"/>
  <circle cx="720" cy="330" r="300" fill="#0F62FE" fill-opacity="0.18"/>
  <circle cx="140" cy="700" r="120" fill="#111111" fill-opacity="0.18"/>

  <!-- Heading kicker -->
  <text x="720" y="115" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" letter-spacing="4" fill="#4B5563" text-anchor="middle">{{heading|24}}</text>

  <!-- Hero stat -->
  <text x="720" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="190" font-weight="900" fill="#0F62FE" text-anchor="middle">{{stat_1|12}}</text>
  <text x="720" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" fill="#111111" text-anchor="middle">{{label_1|30}}</text>
  <line x1="560" y1="505" x2="880" y2="505" stroke="#111111" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Secondary stats -->
  <g transform="translate(330, 560)">
    <rect width="360" height="170" fill="#F4F6F8" rx="18" stroke="#111111" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="180" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="bold" fill="#111111" text-anchor="middle">{{stat_2|12}}</text>
    <text x="180" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#4B5563" text-anchor="middle">{{label_2|30}}</text>
  </g>
  <g transform="translate(750, 560)">
    <rect width="360" height="170" fill="#F4F6F8" rx="18" stroke="#0F62FE" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="180" y="85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="bold" fill="#0F62FE" text-anchor="middle">{{stat_3|12}}</text>
    <text x="180" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#4B5563" text-anchor="middle">{{label_3|30}}</text>
  </g>
</svg>
