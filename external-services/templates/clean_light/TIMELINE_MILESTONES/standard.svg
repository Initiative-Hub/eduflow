    <circle cx="0" cy="0" r="8" fill="#111111"/>
    <text x="0" y="-120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F62FE" text-anchor="middle">{{date_3|15}}</text>
    <text x="0" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">{{desc_3.1|25}}</text>
    <text x="0" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">{{desc_3.2|25}}</text>
  </g>

  <!-- Milestone 4 -->
