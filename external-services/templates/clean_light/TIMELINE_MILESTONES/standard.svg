    <text x="0" y="-70" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">{{desc_2.1|25}}</text>
    <text x="0" y="-40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">{{desc_2.2|25}}</text>
  </g>

  <!-- Milestone 3 -->
