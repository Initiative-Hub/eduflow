<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#0A0E1A"/>
  <circle cx="1330" cy="700" r="160" fill="#FF007F" fill-opacity="0.05"/>

  <!-- Image, left -->
  <g transform="translate(120, 180)">
    <rect x="-8" y="-8" width="536" height="476" fill="none" stroke="#FF007F" stroke-width="2" stroke-opacity="0.45" rx="20"/>
    <clipPath id="media_left_clip"><rect width="520" height="460" rx="14"/></clipPath>
    <image width="520" height="460" href="{{media_image}}" clip-path="url(#media_left_clip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Text, right -->
  <text x="720" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">{{heading|24}}</text>
  <rect x="720" y="240" width="200" height="4" fill="#00F0FF" rx="2"/>

  <g transform="translate(720, 300)">
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="27" fill="#E2E8F0">{{body_text.1|50}}</text>
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="27" fill="#E2E8F0">{{body_text.2|50}}</text>
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="27" fill="#E2E8F0">{{body_text.3|50}}</text>
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="27" fill="#E2E8F0">{{body_text.4|50}}</text>
    <text x="0" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="27" fill="#E2E8F0">{{body_text.5|50}}</text>
    <text x="0" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="27" fill="#E2E8F0">{{body_text.6|50}}</text>
  </g>
</svg>
