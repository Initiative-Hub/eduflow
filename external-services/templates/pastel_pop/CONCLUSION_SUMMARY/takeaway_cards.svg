<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FDF6F9"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#4E9B82" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="1290" cy="130" r="150" fill="#D26A92" fill-opacity="0.18"/>

  <!-- Heading -->
  <text x="140" y="150" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="56" font-weight="bold" fill="#4A3B50">{{heading|24}}</text>
  <rect x="140" y="175" width="220" height="4" fill="#D26A92" rx="2"/>

  <!-- Takeaway cards, 2 x 2, each with a check badge -->
  <g transform="translate(140, 250)">
    <!-- Point 1 -->
    <g>
      <rect width="570" height="190" fill="#FFFFFF" rx="18" stroke="#4E9B82" stroke-width="1.5" stroke-opacity="0.3"/>
      <circle cx="70" cy="95" r="30" fill="#4E9B82" fill-opacity="0.18" stroke="#4E9B82" stroke-width="2"/>
      <path d="M 56 95 L 66 106 L 85 82" fill="none" stroke="#4E9B82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="105" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{summary_points.1|35}}</text>
    </g>
    <!-- Point 2 -->
    <g transform="translate(610, 0)">
      <rect width="570" height="190" fill="#FFFFFF" rx="18" stroke="#D26A92" stroke-width="1.5" stroke-opacity="0.3"/>
      <circle cx="70" cy="95" r="30" fill="#D26A92" fill-opacity="0.18" stroke="#D26A92" stroke-width="2"/>
