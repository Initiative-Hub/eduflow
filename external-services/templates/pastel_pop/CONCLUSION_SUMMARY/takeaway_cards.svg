      <rect width="570" height="190" fill="#FFFFFF" rx="18" stroke="#D26A92" stroke-width="1.5" stroke-opacity="0.3"/>
      <circle cx="70" cy="95" r="30" fill="#D26A92" fill-opacity="0.18" stroke="#D26A92" stroke-width="2"/>
      <path d="M 56 95 L 66 106 L 85 82" fill="none" stroke="#D26A92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="105" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{summary_points.3|35}}</text>
    </g>
    <!-- Point 4 -->
    <g transform="translate(610, 230)">
      <rect width="570" height="190" fill="#FFFFFF" rx="18" stroke="#4E9B82" stroke-width="1.5" stroke-opacity="0.3"/>
