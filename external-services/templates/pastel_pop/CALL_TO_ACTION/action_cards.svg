<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FDF6F9"/>
  <rect x="0" y="0" width="1440" height="8" fill="#D26A92"/>
  <circle cx="1300" cy="720" r="200" fill="#4E9B82" fill-opacity="0.18"/>

  <!-- Heading, centered -->
  <text x="720" y="170" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="60" font-weight="bold" fill="#4A3B50" text-anchor="middle">{{heading|24}}</text>
  <rect x="600" y="200" width="240" height="4" fill="#4E9B82" rx="2"/>

  <!-- Action cards, 2 x 2 -->
  <g transform="translate(130, 280)">
    <!-- Action 1 -->
    <g>
      <rect width="570" height="170" fill="#FFFFFF" rx="18" stroke="#4E9B82" stroke-width="1.5" stroke-opacity="0.55"/>
      <path d="M 48 70 L 78 85 L 48 100 Z" fill="#4E9B82"/>
      <text x="120" y="95" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="27" fill="#6E5A77">{{action_items.1|50}}</text>
    </g>
    <!-- Action 2 -->
    <g transform="translate(610, 0)">
      <rect width="570" height="170" fill="#FFFFFF" rx="18" stroke="#D26A92" stroke-width="1.5" stroke-opacity="0.55"/>
      <path d="M 48 70 L 78 85 L 48 100 Z" fill="#D26A92"/>
      <text x="120" y="95" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="27" fill="#6E5A77">{{action_items.2|50}}</text>
    </g>
    <!-- Action 3 -->
    <g transform="translate(0, 210)">
      <rect width="570" height="170" fill="#FFFFFF" rx="18" stroke="#D26A92" stroke-width="1.5" stroke-opacity="0.55"/>
      <path d="M 48 70 L 78 85 L 48 100 Z" fill="#D26A92"/>
      <text x="120" y="95" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="27" fill="#6E5A77">{{action_items.3|50}}</text>
    </g>
    <!-- Action 4 -->
    <g transform="translate(610, 210)">
      <rect width="570" height="170" fill="#FFFFFF" rx="18" stroke="#4E9B82" stroke-width="1.5" stroke-opacity="0.55"/>
      <path d="M 48 70 L 78 85 L 48 100 Z" fill="#4E9B82"/>
      <text x="120" y="95" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="27" fill="#6E5A77">{{action_items.4|50}}</text>
    </g>
  </g>
</svg>
