<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FDF6F9"/>
  <circle cx="720" cy="420" r="260" fill="#D26A92" fill-opacity="0.18"/>

  <!-- Heading, centered -->
  <text x="720" y="130" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="54" font-weight="bold" fill="#4A3B50" text-anchor="middle">{{heading|24}}</text>
  <rect x="610" y="158" width="220" height="4" fill="#4E9B82" rx="2"/>

  <!-- Left card (cyan) -->
  <g transform="translate(110, 220)">
    <rect width="560" height="500" fill="#FFFFFF" rx="22" stroke="#4E9B82" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="150" y="-26" width="260" height="52" fill="#4E9B82" rx="26"/>
    <text x="280" y="9" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#FDF6F9" text-anchor="middle">{{left_col_title|30}}</text>
    <text x="50" y="105" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{left_col_text.1|40}}</text>
    <text x="50" y="175" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{left_col_text.2|40}}</text>
    <text x="50" y="245" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{left_col_text.3|40}}</text>
    <text x="50" y="315" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{left_col_text.4|40}}</text>
    <text x="50" y="385" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{left_col_text.5|40}}</text>
  </g>

  <!-- Divider badge -->
  <circle cx="720" cy="470" r="44" fill="#FDF6F9" stroke="#D26A92" stroke-width="3"/>
  <text x="720" y="482" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" font-weight="900" fill="#D26A92" text-anchor="middle">VS</text>

  <!-- Right card (pink) -->
  <g transform="translate(770, 220)">
    <rect width="560" height="500" fill="#FFFFFF" rx="22" stroke="#D26A92" stroke-width="2" stroke-opacity="0.45"/>
    <rect x="150" y="-26" width="260" height="52" fill="#D26A92" rx="26"/>
    <text x="280" y="9" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#4A3B50" text-anchor="middle">{{right_col_title|30}}</text>
    <text x="50" y="105" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{right_col_text.1|40}}</text>
    <text x="50" y="175" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{right_col_text.2|40}}</text>
    <text x="50" y="245" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{right_col_text.3|40}}</text>
    <text x="50" y="315" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{right_col_text.4|40}}</text>
    <text x="50" y="385" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{right_col_text.5|40}}</text>
  </g>
</svg>
