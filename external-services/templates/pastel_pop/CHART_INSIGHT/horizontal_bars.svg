<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FDF6F9"/>
  <line x1="80" y1="0" x2="80" y2="810" stroke="#D26A92" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Heading -->
  <text x="140" y="150" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="56" font-weight="bold" fill="#4A3B50">{{heading|24}}</text>
  <rect x="140" y="175" width="220" height="4" fill="#4E9B82" rx="2"/>

  <!-- Horizontal bar chart -->
  <g transform="translate(140, 260)">
    <line x1="200" y1="-10" x2="200" y2="440" stroke="#6E5A77" stroke-opacity="0.2" stroke-width="2"/>
    <!-- Bar 1 -->
    <g>
      <text x="180" y="48" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="24" fill="#6E5A77" text-anchor="end">{{chart_label_1|12}}</text>
      <rect x="200" y="20" width="460" height="44" fill="#4E9B82" rx="8"/>
      <text x="680" y="52" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="bold" fill="#4E9B82">{{chart_value_1|8}}</text>
    </g>
    <!-- Bar 2 -->
    <g transform="translate(0, 110)">
      <text x="180" y="48" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="24" fill="#6E5A77" text-anchor="end">{{chart_label_2|12}}</text>
      <rect x="200" y="20" width="370" height="44" fill="#D26A92" rx="8"/>
      <text x="590" y="52" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="bold" fill="#D26A92">{{chart_value_2|8}}</text>
    </g>
    <!-- Bar 3 -->
    <g transform="translate(0, 220)">
      <text x="180" y="48" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="24" fill="#6E5A77" text-anchor="end">{{chart_label_3|12}}</text>
      <rect x="200" y="20" width="280" height="44" fill="#4E9B82" fill-opacity="0.65" rx="8"/>
      <text x="500" y="52" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="bold" fill="#4E9B82">{{chart_value_3|8}}</text>
    </g>
    <!-- Bar 4 -->
    <g transform="translate(0, 330)">
      <text x="180" y="48" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="24" fill="#6E5A77" text-anchor="end">{{chart_label_4|12}}</text>
      <rect x="200" y="20" width="190" height="44" fill="#D26A92" fill-opacity="0.65" rx="8"/>
      <text x="410" y="52" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="bold" fill="#D26A92">{{chart_value_4|8}}</text>
    </g>
  </g>

  <!-- Insight panel, right -->
  <g transform="translate(960, 260)">
    <rect width="360" height="440" fill="#FFFFFF" rx="20" stroke="#4E9B82" stroke-width="1.5" stroke-opacity="0.55"/>
    <rect x="30" y="34" width="120" height="36" fill="#D26A92" rx="18"/>
    <text x="90" y="59" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="18" font-weight="bold" fill="#4A3B50" text-anchor="middle">INSIGHT</text>
    <text x="30" y="130" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{insight_text.1|45}}</text>
    <text x="30" y="185" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{insight_text.2|45}}</text>
    <text x="30" y="240" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="26" fill="#6E5A77">{{insight_text.3|45}}</text>
  </g>
</svg>
