<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#FDF6F9"/>
  <!-- Left heading panel -->
  <rect x="0" y="0" width="470" height="810" fill="#FFFFFF"/>
  <rect x="462" y="0" width="8" height="810" fill="#4E9B82"/>
  <circle cx="110" cy="700" r="120" fill="#D26A92" fill-opacity="0.18"/>

  <rect x="80" y="270" width="90" height="8" fill="#D26A92" rx="4"/>
  <!-- Heading wraps to up to 3 lines; data-w lets long lines shrink to fit the panel -->
  <text x="80" y="350" data-w="360" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="46" font-weight="bold" fill="#4A3B50">{{heading.1|16}}</text>
  <text x="80" y="410" data-w="360" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="46" font-weight="bold" fill="#4A3B50">{{heading.2|16}}</text>
  <text x="80" y="470" data-w="360" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="46" font-weight="bold" fill="#4A3B50">{{heading.3|16}}</text>

  <!-- Bullets, right -->
  <g transform="translate(560, 140)">
    <!-- Bullet 1 -->
    <g>
      <rect x="0" y="18" width="18" height="18" fill="#D26A92" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{bullets.1|70}}</text>
    </g>
    <!-- Bullet 2 -->
    <g transform="translate(0, 110)">
      <rect x="0" y="18" width="18" height="18" fill="#4E9B82" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{bullets.2|70}}</text>
    </g>
    <!-- Bullet 3 -->
    <g transform="translate(0, 220)">
      <rect x="0" y="18" width="18" height="18" fill="#D26A92" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{bullets.3|70}}</text>
    </g>
    <!-- Bullet 4 -->
    <g transform="translate(0, 330)">
      <rect x="0" y="18" width="18" height="18" fill="#4E9B82" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{bullets.4|70}}</text>
    </g>
    <!-- Bullet 5 -->
    <g transform="translate(0, 440)">
      <rect x="0" y="18" width="18" height="18" fill="#D26A92" rx="9"/>
      <text x="50" y="35" data-w="770" font-family="'Avenir Next', 'Trebuchet MS', Verdana, sans-serif" font-size="28" fill="#6E5A77">{{bullets.5|70}}</text>
    </g>
  </g>
</svg>
