<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810">
  <rect width="1440" height="810" fill="#0A0E1A"/>
  <circle cx="720" cy="330" r="300" fill="#00F0FF" fill-opacity="0.04"/>
  <circle cx="140" cy="700" r="120" fill="#FF007F" fill-opacity="0.05"/>

  <!-- Heading kicker -->
  <text x="720" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="bold" letter-spacing="4" fill="#E2E8F0" text-anchor="middle">{{heading|24}}</text>

  <!-- Hero stat -->
  <text x="720" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="190" font-weight="900" fill="#00F0FF" text-anchor="middle">{{stat_1|12}}</text>
  <text x="720" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="34" fill="#FFFFFF" text-anchor="middle">{{label_1|30}}</text>
  <line x1="560" y1="505" x2="880" y2="505" stroke="#FF007F" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Secondary stats -->
  <g transform="translate(330, 560)">
    <rect width="360" height="170" fill="#111827" rx="18" stroke="#FF007F" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="180" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="#FF007F" text-anchor="middle">{{stat_2|12}}</text>
    <text x="180" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#E2E8F0" text-anchor="middle">{{label_2|30}}</text>
  </g>
  <g transform="translate(750, 560)">
    <rect width="360" height="170" fill="#111827" rx="18" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="180" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="#00F0FF" text-anchor="middle">{{stat_3|12}}</text>
    <text x="180" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#E2E8F0" text-anchor="middle">{{label_3|30}}</text>
  </g>
</svg>
