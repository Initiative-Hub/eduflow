  <rect x="80" y="80" width="139" height="34" rx="17" fill="#8B5CF6" opacity=".16"/><circle cx="99" cy="97" r="5" fill="#8B5CF6"/><text x="114" y="103" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8B5CF6" letter-spacing="0.06em" data-w="95" data-h="20">TAKEAWAYS</text><text x="80" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="35.6" font-weight="700" fill="#2F2142" data-w="1160" data-h="70">Designing Assessment That Actually Measures Understanding</text><rect x="80" y="208" width="150" height="6" rx="3" fill="url(#rule)"/><g><rect x="80" y="250" width="1280" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="250" width="6" height="86" rx="3" fill="#8B5CF6"/><circle cx="132" cy="293.0" r="16" fill="#8B5CF6" opacity=".22"/><text x="132" y="299.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8B5CF6" text-anchor="middle" data-w="34" data-h="22">1</text><text x="178" y="300.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#2F2142" data-w="1140" data-h="53"><tspan x="178" dy="0.0">Retrieval practice beats rereading — testing yourself forces the brain to reconstruct the</tspan><tspan x="178" dy="25.6">answer, which is what actually strengthens memory.</tspan></text></g><g><rect x="80" y="350" width="1280" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="132" cy="393.0" r="16" fill="#925FC6" opacity=".22"/><text x="132" y="399.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#925FC6" text-anchor="middle" data-w="34" data-h="22">2</text><text x="178" y="400.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#2F2142" data-w="1140" data-h="53"><tspan x="178" dy="0.0">Retrieval practice beats rereading — testing yourself forces the brain to reconstruct the</tspan><tspan x="178" dy="25.6">answer, which is what actually strengthens memory.</tspan></text></g><g><rect x="80" y="450" width="1280" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="450" width="6" height="86" rx="3" fill="#8B5CF6"/><circle cx="132" cy="493.0" r="16" fill="#C05177" opacity=".22"/><text x="132" y="499.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#C05177" text-anchor="middle" data-w="34" data-h="22">3</text><text x="178" y="500.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#2F2142" data-w="1140" data-h="53"><tspan x="178" dy="0.0">Retrieval practice beats rereading — testing yourself forces the brain to reconstruct the</tspan><tspan x="178" dy="25.6">answer, which is what actually strengthens memory.</tspan></text></g><rect x="0" y="804" width="1440" height="6" fill="url(#rule)"/></svg>