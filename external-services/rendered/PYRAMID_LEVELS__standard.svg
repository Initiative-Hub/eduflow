  <rect x="80" y="80" width="194" height="34" rx="17" fill="#8B5CF6" opacity=".16"/><circle cx="99" cy="97" r="5" fill="#8B5CF6"/><text x="114" y="103" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8B5CF6" letter-spacing="0.06em" data-w="150" data-h="20">PYRAMID LEVELS</text><text x="80" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="35.6" font-weight="700" fill="#2F2142" data-w="1160" data-h="70">Designing Assessment That Actually Measures Understanding</text><rect x="80" y="208" width="150" height="6" rx="3" fill="url(#rule)"/><g><rect x="350" y="250" width="740" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="350" y="250" width="6" height="96" rx="3" fill="#8B5CF6"/><text x="384" y="290" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#8B5CF6" data-w="672" data-h="30">Concept mapping reveals the gaps a summary hides</text><text x="384" y="322" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.0" fill="#64748B" data-w="672" data-h="26"><tspan x="384" dy="0.0">Spaced review outperforms cramming because forgetting a little between sessions is what makes the next recall</tspan><tspan x="384" dy="12.3">effortful.</tspan></text></g><g><rect x="260" y="354" width="920" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="260" y="354" width="6" height="96" rx="3" fill="#8B5CF6"/><text x="294" y="394" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#925FC6" data-w="852" data-h="30">Concept mapping reveals the gaps a summary hides</text><text x="294" y="426" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.9" fill="#64748B" data-w="852" data-h="26">Spaced review outperforms cramming because forgetting a little between sessions is what makes the next recall effortful.</text></g><g><rect x="170" y="458" width="1100" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="170" y="458" width="6" height="96" rx="3" fill="#8B5CF6"/><text x="204" y="498" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#C05177" data-w="1032" data-h="30">Concept mapping reveals the gaps a summary hides</text><text x="204" y="530" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.2" fill="#64748B" data-w="1032" data-h="26">Spaced review outperforms cramming because forgetting a little between sessions is what makes the next recall effortful.</text></g><g><rect x="80" y="562" width="1280" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><rect x="80" y="562" width="6" height="96" rx="3" fill="#8B5CF6"/><text x="114" y="602" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#846E99" data-w="1212" data-h="30">Concept mapping reveals the gaps a summary hides</text><text x="114" y="634" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#64748B" data-w="1212" data-h="26">Spaced review outperforms cramming because forgetting a little between sessions is what makes the next recall effortful.</text></g><text x="80" y="768" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#64748B" data-w="1280" data-h="24">Data drawn from 2,140 enrolments across four semesters, 2022 to 2025</text><rect x="0" y="804" width="1440" height="6" fill="url(#rule)"/></svg>