  <rect x="80" y="80" width="150" height="34" rx="17" fill="#8B5CF6" opacity=".16"/><circle cx="99" cy="97" r="5" fill="#8B5CF6"/><text x="114" y="103" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8B5CF6" letter-spacing="0.06em" data-w="106" data-h="20">KEY POINTS</text><text x="80" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="35.6" font-weight="700" fill="#2F2142" data-w="1160" data-h="70">Designing Assessment That Actually Measures Understanding</text><rect x="80" y="208" width="150" height="6" rx="3" fill="url(#rule)"/><g><circle cx="98" cy="248" r="7" fill="#8B5CF6"/><text x="128" y="255" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#2F2142" data-w="1180" data-h="76"><tspan x="128" dy="0.0">Retrieval practice beats rereading — testing yourself forces the brain to reconstruct the</tspan><tspan x="128" dy="28.1">answer, which is what actually strengthens memory.</tspan></text><rect x="128" y="275" width="1180" height="1" fill="#E2E8F0" opacity=".55"/></g><g><circle cx="98" cy="340" r="7" fill="#925FC6"/><text x="128" y="347" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#2F2142" data-w="1180" data-h="76"><tspan x="128" dy="0.0">Retrieval practice beats rereading — testing yourself forces the brain to reconstruct the</tspan><tspan x="128" dy="28.1">answer, which is what actually strengthens memory.</tspan></text><rect x="128" y="367" width="1180" height="1" fill="#E2E8F0" opacity=".55"/></g><g><circle cx="98" cy="432" r="7" fill="#C05177"/><text x="128" y="439" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#2F2142" data-w="1180" data-h="76"><tspan x="128" dy="0.0">Retrieval practice beats rereading — testing yourself forces the brain to reconstruct the</tspan><tspan x="128" dy="28.1">answer, which is what actually strengthens mem