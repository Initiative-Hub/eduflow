name: Enforce Vercel Deploy Author

on:
  push:
    branches:
      - main

jobs:
  enforce-author:
    name: Enforce Vercel Deploy Author
    timeout-minutes: 20
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    env:
      EXPECTED_EMAIL: ${{ secrets.VERCEL_AUTHOR_EMAIL || 'your-vercel-owner-email@example.com' }}
      EXPECTED_NAME: ${{ secrets.VERCEL_AUTHOR_NAME || 'Vercel Owner Name' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check latest commit author
        id: check-author
        run: |
          echo "Expected author email: $EXPECTED_EMAIL"
          
          # Get the email of the author of the latest commit
          LATEST_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          echo "Latest commit author email: $LATEST_AUTHOR_EMAIL"
          
          if [ "$LATEST_AUTHOR_EMAIL" != "$EXPECTED_EMAIL" ]; then
            echo "Author mismatch detected."
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            echo "Author matches. All good!"
          fi

      - name: Create Pull Request
        if: steps.check-author.outputs.mismatch == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.VERCEL_AUTHOR_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: ensure Vercel deployment author"
          author: "${{ env.EXPECTED_NAME }} <${{ env.EXPECTED_EMAIL }}>"
          committer: "${{ env.EXPECTED_NAME }} <${{ env.EXPECTED_EMAIL }}>"
          branch: "chore/trigger-vercel-deploy"
          delete-branch: true
          title: "chore: trigger Vercel deployment"
          body: "Automated PR to ensure correctly authored commit for Vercel."
          base: main
      
      - name: Fail Workflow After Creating PR
        if: steps.check-author.outputs.mismatch == 'true'
        run: |
          echo "Author mismatch detected. A PR has been created to fix identity."
          echo "PR URL: ${{ steps.create-pr.outputs.pull-request-url }}"
          exit 1