name: Prisma Schema Check

on:
  push:
  workflow_dispatch:

jobs:
  prisma-schema-check:
    name: Verify Prisma schema matches migrations
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      # Main Database Service
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduflow_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Shadow Database Service
      postgres-shadow:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduflow_shadow
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduflow_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/eduflow_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/eduflow_shadow?schema=public
    
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Prisma schema matches migrations
        run: |
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code