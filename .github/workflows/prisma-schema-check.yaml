name: Prisma Schema Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - 'main'
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  prisma-schema-check:
    name: Verify Prisma schema matches migrations
    runs-on: self-hosted
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' || 
      (github.head_ref != 'chore/trigger-vercel-deploy' && !startsWith(github.head_ref, 'fix/biome-formatting-'))
    services:
      postgres-shadow:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduflow_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduflow_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/eduflow_shadow?schema=public
    
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Prisma schema matches migrations
        run: |
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
