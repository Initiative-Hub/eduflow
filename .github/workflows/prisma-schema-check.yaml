name: Prisma Schema Check

on:
  push:
  workflow_dispatch:

jobs:
  prisma-schema-check:
    name: Verify Prisma schema matches migrations
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eduflow_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5433/eduflow_db
      SHADOW_DATABASE_URL: postgresql://postgres:password@localhost:5433/eduflow_shadow_db
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Prisma schema matches migrations
        run: |
          bunx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
