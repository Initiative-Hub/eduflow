name: Bun Test Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' || 
      (github.head_ref != 'chore/trigger-vercel-deploy' && !startsWith(github.head_ref, 'fix/biome-formatting-'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
