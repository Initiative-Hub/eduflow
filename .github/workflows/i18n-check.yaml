name: i18n Check

on:
  push:
    branches-ignore:
      - staging
      - production
  workflow_dispatch:

jobs:
  i18n-check:
    name: i18n Check
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation sorting
        run: bun i18n:sort:check

      - name: Check locale key parity
        run: bun i18n:key-parity
