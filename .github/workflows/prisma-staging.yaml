name: Prisma Staging Migration

on:
  workflow_run:
    workflows:
      - "Vercel GitFlow Staging Deployment"
    types:
      - completed
    branches:
      - staging
  workflow_dispatch:

jobs:
  check-prerequisites:
    name: Check prerequisites
    runs-on: ubuntu-latest
    # Only check if manually triggered or if workflow_run succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check Vercel deployment status
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking prerequisites for staging migration..."

          # Check Vercel staging deployment status
          echo "Checking Vercel staging deployment status..."
          VERCEL_RUN=$(gh api \
            repos/${{ github.repository }}/actions/workflows/vercel-staging.yaml/runs \
            --jq '.workflow_runs[0] | {conclusion: .conclusion, status: .status, created_at: .created_at}')

          VERCEL_CONCLUSION=$(echo "$VERCEL_RUN" | jq -r '.conclusion')
          VERCEL_STATUS=$(echo "$VERCEL_RUN" | jq -r '.status')

          echo "Vercel staging deployment status: $VERCEL_STATUS"
          echo "Vercel staging deployment conclusion: $VERCEL_CONCLUSION"

          if [ "$VERCEL_CONCLUSION" != "success" ]; then
            echo "❌ Vercel staging deployment has not completed successfully. Cannot proceed with staging migration."
            exit 1
          fi

          echo "✅ Vercel staging deployment completed successfully."

  deploy:
    name: Migrate staging database
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: check-prerequisites

    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy migrations to staging
        run: prisma migrate deploy
