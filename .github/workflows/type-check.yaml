name: TypeScript Type Check

on:
  push:
    branches-ignore:
      - chore/trigger-vercel-deploy
      - fix/biome-formatting-*
      - staging
      - production
  workflow_dispatch:

jobs:
  type-check:
    name: Type Check
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
 
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run type-check
