name: TypeScript Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'fix/biome-formatting-')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run type-check
