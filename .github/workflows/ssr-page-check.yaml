name: SSR Page Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  ssr-page-check:
    name: SSR Page Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' || 
      (github.head_ref != 'chore/trigger-vercel-deploy' && !startsWith(github.head_ref, 'fix/biome-formatting-'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce SSR page entries
        run: bun run ssr-pages:check
