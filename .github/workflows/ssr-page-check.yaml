name: SSR Page Check

on:
  push:
    branches-ignore:
      - staging
      - production
  workflow_dispatch:

jobs:
  ssr-page-check:
    name: SSR Page Check
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce SSR page entries
        run: bun run ssr-pages:check
