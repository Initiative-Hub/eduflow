name: Partykit Websocket Server Staging Deployment

on:
  push:
    branches:
      - staging
    paths:
      - party/**
      - partykit.json
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_APP_URL: ${{ secrets.STAGING_NEXT_APP_URL }}
      LIVE_GAME_TICKET_SECRET: ${{ secrets.STAGING_LIVE_GAME_TICKET_SECRET }}
      LIVE_GAME_S2S_SECRET: ${{ secrets.STAGING_LIVE_GAME_S2S_SECRET }}
      PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
      PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy
        run: |
          bun partykit deploy -n eduflow-party-staging \
            --var NEXT_APP_URL="$NEXT_APP_URL" \
            --var LIVE_GAME_TICKET_SECRET="$LIVE_GAME_TICKET_SECRET" \
            --var LIVE_GAME_S2S_SECRET="$LIVE_GAME_S2S_SECRET"